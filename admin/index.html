<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vega Cash – Panel Admin</title>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    CMS.registerPreviewStyle("https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=DM+Sans:wght@400;500&display=swap");
    CMS.registerPreviewStyle("/admin/preview.css");

    var LandingPreview = createClass({
      render: function() {
        var entry = this.props.entry;
        var hero  = entry.getIn(['data','hero'])       || {};
        var stats = entry.getIn(['data','stats'])      || {};
        var bens  = entry.getIn(['data','beneficios']) || {};
        var pasos = entry.getIn(['data','pasos'])      || {};
        var form  = entry.getIn(['data','formulario']) || {};

        function g(obj, key) {
          if (!obj) return '';
          if (typeof obj.get === 'function') return obj.get(key) || '';
          return obj[key] || '';
        }

        return h('div', {},
          // NAV
          h('nav', {},
            h('div', {className:'nav-logo'}, 'VEGA', h('span', {}, '.pe')),
            h('a', {href:'#', className:'nav-pill'}, 'Registrarme')
          ),

          // HERO
          h('section', {className:'hero'},
            h('div', {className:'hero-badge'}, 'Programa de fidelización'),
            h('h1', {}, g(hero,'titulo') || 'Bienvenido al Vega Cash'),
            h('p', {className:'hero-sub'}, g(hero,'subtitulo')),
            h('a', {href:'#', className:'hero-cta'}, g(hero,'cta') || 'Quiero unirme')
          ),

          // STATS
          h('div', {className:'stats-bar'},
            h('div', {className:'stat-item'}, h('span',{className:'stat-num'},g(stats,'s1_num')), h('span',{className:'stat-label'},g(stats,'s1_label'))),
            h('div', {className:'stat-item'}, h('span',{className:'stat-num'},g(stats,'s2_num')), h('span',{className:'stat-label'},g(stats,'s2_label'))),
            h('div', {className:'stat-item'}, h('span',{className:'stat-num'},g(stats,'s3_num')), h('span',{className:'stat-label'},g(stats,'s3_label'))),
            h('div', {className:'stat-item'}, h('span',{className:'stat-num'},g(stats,'s4_num')), h('span',{className:'stat-label'},g(stats,'s4_label')))
          ),

          // BENEFICIOS
          h('section', {className:'beneficios'},
            h('div', {className:'beneficios-header'},
              h('div', {className:'section-tag'}, '¿Por qué unirse?'),
              h('h2', {className:'section-title'}, 'Beneficios que marcan la diferencia')
            ),
            h('div', {className:'beneficios-grid'},
              h('div', {className:'beneficio-card'}, h('h3',{},g(bens,'b1_titulo')), h('p',{},g(bens,'b1_desc'))),
              h('div', {className:'beneficio-card'}, h('h3',{},g(bens,'b2_titulo')), h('p',{},g(bens,'b2_desc'))),
              h('div', {className:'beneficio-card'}, h('h3',{},g(bens,'b3_titulo')), h('p',{},g(bens,'b3_desc'))),
              h('div', {className:'beneficio-card'}, h('h3',{},g(bens,'b4_titulo')), h('p',{},g(bens,'b4_desc')))
            )
          ),

          // PASOS
          h('section', {className:'como-funciona'},
            h('div', {className:'pasos-layout'},
              h('div', {},
                h('div', {className:'section-tag'}, g(pasos,'tag') || '¿Cómo funciona?'),
                h('h2', {className:'section-title'}, g(pasos,'titulo')),
                h('p', {className:'section-sub'}, g(pasos,'subtitulo')),
                h('ul', {className:'pasos-list'},
                  h('li', {className:'paso'}, h('div',{className:'paso-num'},'1'), h('div',{className:'paso-info'}, h('h4',{},g(pasos,'p1_titulo')), h('p',{},g(pasos,'p1_desc')))),
                  h('li', {className:'paso'}, h('div',{className:'paso-num'},'2'), h('div',{className:'paso-info'}, h('h4',{},g(pasos,'p2_titulo')), h('p',{},g(pasos,'p2_desc')))),
                  h('li', {className:'paso'}, h('div',{className:'paso-num'},'3'), h('div',{className:'paso-info'}, h('h4',{},g(pasos,'p3_titulo')), h('p',{},g(pasos,'p3_desc'))))
                )
              ),
              h('div', {className:'pasos-visual'}, 'Vista previa del perfil de miembro')
            )
          ),

          // FORMULARIO
          h('section', {className:'formulario-section'},
            h('div', {className:'form-wrapper'},
              h('div', {className:'section-tag'}, g(form,'tag')),
              h('h2', {className:'section-title'}, g(form,'titulo')),
              h('p', {className:'section-sub'}, g(form,'subtitulo')),
              h('div', {className:'form-card'},
                h('div', {className:'form-grid'},
                  h('div', {className:'form-group'}, h('label',{}, 'Nombres *'), h('input',{type:'text', placeholder:'Ej. Juan Carlos'})),
                  h('div', {className:'form-group'}, h('label',{}, 'Apellidos *'), h('input',{type:'text', placeholder:'Ej. García López'})),
                  h('div', {className:'form-group full'},
                    h('label',{}, 'Tipo y número de documento *'),
                    h('div', {className:'doc-row'},
                      h('select',{}, h('option',{}, 'DNI'), h('option',{}, 'CE'), h('option',{}, 'Pasaporte')),
                      h('input',{type:'text', placeholder:'Número de documento'})
                    )
                  ),
                  h('div', {className:'form-group'}, h('label',{}, 'Fecha de nacimiento *'), h('input',{type:'date'})),
                  h('div', {className:'form-group'}, h('label',{}, 'Celular *'), h('input',{type:'tel', placeholder:'9XX XXX XXX'})),
                  h('div', {className:'form-group full'}, h('label',{}, 'Correo electrónico *'), h('input',{type:'email', placeholder:'tu@correo.com'})),
                  h('div', {className:'form-group full'},
                    h('label',{}, 'Distrito *'),
                    h('select',{}, h('option',{}, 'Selecciona tu distrito'), h('option',{}, 'Miraflores'), h('option',{}, 'San Isidro'), h('option',{}, 'Surco'))
                  ),
                  h('hr', {className:'divider'}),
                  h('div', {className:'terms-row'},
                    h('input',{type:'checkbox'}),
                    h('p', {className:'terms-text'}, g(form,'texto_legal') || 'Acepto los términos y condiciones y he leído la política de privacidad de Corporación VEGA SAC.')
                  )
                ),
                h('button', {className:'submit-btn'}, 'Crear mi cuenta Vega Cash'),
                h('p', {className:'privacy-note'}, '🔒 Tus datos están protegidos. Nunca los compartiremos con terceros.')
              )
            )
          ),

          // FOOTER
          h('footer', {},
            h('div', {className:'footer-logo'}, 'VEGA', h('span',{},'.pe')),
            h('p', {}, '© 2026 Corporación VEGA SAC')
          )
        );
      }
    });

    CMS.registerPreviewTemplate('landing', LandingPreview);
  </script>
</body>
</html>
