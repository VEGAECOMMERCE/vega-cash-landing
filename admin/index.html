<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vega Cash – Panel Admin</title>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    const css = `
      @import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=DM+Sans:wght@400;500&display=swap');
      *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
      :root{--rojo:#CC0000;--rojo-oscuro:#A80000;--blanco:#FFFFFF;--gris-fondo:#F7F6F3;--gris-borde:#E5E3DC;--gris-texto:#6B6860;--negro:#1A1917;--font-display:'Sora',sans-serif;--font-body:'DM Sans',sans-serif;}
      body{font-family:var(--font-body);background:var(--blanco);color:var(--negro);line-height:1.6;overflow-x:hidden;}
      nav{background:var(--blanco);border-bottom:1px solid var(--gris-borde);padding:0 40px;height:60px;display:flex;align-items:center;justify-content:space-between;}
      .nav-logo{font-family:var(--font-display);font-weight:700;font-size:18px;color:var(--rojo);}
      .nav-logo span{color:var(--negro);}
      .nav-pill{background:var(--rojo);color:white;font-family:var(--font-display);font-size:12px;font-weight:600;padding:6px 16px;border-radius:20px;text-decoration:none;text-transform:uppercase;}
      .hero{background:var(--rojo);padding:72px 40px 64px;text-align:center;}
      .hero-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,0.15);color:white;font-family:var(--font-display);font-size:11px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;padding:5px 14px;border-radius:20px;margin-bottom:24px;}
      .hero h1{font-family:var(--font-display);font-size:40px;font-weight:700;color:white;line-height:1.15;letter-spacing:-0.03em;max-width:640px;margin:0 auto 16px;}
      .hero-sub{font-size:16px;color:rgba(255,255,255,0.82);max-width:460px;margin:0 auto 32px;line-height:1.6;}
      .hero-cta{display:inline-flex;align-items:center;gap:8px;background:white;color:var(--rojo);font-family:var(--font-display);font-size:15px;font-weight:600;padding:14px 32px;border-radius:8px;text-decoration:none;}
      .stats-bar{background:var(--negro);padding:0 40px;display:flex;justify-content:center;}
      .stat-item{padding:18px 32px;text-align:center;border-right:1px solid rgba(255,255,255,0.08);}
      .stat-item:last-child{border-right:none;}
      .stat-num{font-family:var(--font-display);font-size:22px;font-weight:700;color:white;display:block;}
      .stat-label{font-size:11px;color:rgba(255,255,255,0.5);text-transform:uppercase;letter-spacing:0.08em;display:block;}
      .beneficios{background:var(--gris-fondo);padding:64px 40px;}
      .beneficios-header{text-align:center;margin-bottom:48px;}
      .section-tag{display:inline-block;font-family:var(--font-display);font-size:11px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--rojo);margin-bottom:12px;}
      .section-title{font-family:var(--font-display);font-size:28px;font-weight:700;letter-spacing:-0.02em;line-height:1.2;color:var(--negro);margin-bottom:8px;}
      .section-sub{font-size:15px;color:var(--gris-texto);line-height:1.6;}
      .beneficios-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;max-width:900px;margin:0 auto;}
      .beneficio-card{background:white;border:1px solid var(--gris-borde);border-radius:12px;padding:28px 24px;}
      .beneficio-card h3{font-family:var(--font-display);font-size:15px;font-weight:600;color:var(--negro);margin-bottom:6px;}
      .beneficio-card p{font-size:13px;color:var(--gris-texto);line-height:1.55;}
      .como-funciona{background:white;padding:64px 40px;}
      .pasos-layout{display:grid;grid-template-columns:1fr 1fr;gap:48px;max-width:860px;margin:0 auto;}
      .pasos-list{list-style:none;margin-top:32px;}
      .paso{display:flex;gap:16px;padding:20px 0;border-bottom:1px solid var(--gris-borde);}
      .paso:last-child{border-bottom:none;}
      .paso-num{width:32px;height:32px;border-radius:50%;background:var(--rojo);color:white;font-family:var(--font-display);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
      .paso-info h4{font-family:var(--font-display);font-size:14px;font-weight:600;color:var(--negro);margin-bottom:4px;}
      .paso-info p{font-size:13px;color:var(--gris-texto);line-height:1.5;}
      .formulario-section{background:var(--gris-fondo);padding:64px 40px 80px;}
      .form-wrapper{max-width:620px;margin:0 auto;}
      .form-header{margin-bottom:36px;}
      .form-placeholder{background:white;border:1px solid var(--gris-borde);border-radius:16px;padding:48px;text-align:center;color:var(--gris-texto);font-size:14px;}
      footer{background:var(--negro);padding:32px 40px;text-align:center;}
      .footer-logo{font-family:var(--font-display);font-size:16px;font-weight:700;color:white;margin-bottom:8px;}
      .footer-logo span{color:var(--rojo);}
      footer p{font-size:12px;color:rgba(255,255,255,0.35);}
    `;

    var h = CMS.createClass({
      render: function() {
        var entry = this.props.entry;
        var hero  = entry.getIn(['data','hero'])       || CMS.Map();
        var stats = entry.getIn(['data','stats'])      || CMS.Map();
        var bens  = entry.getIn(['data','beneficios']) || CMS.Map();
        var pasos = entry.getIn(['data','pasos'])      || CMS.Map();
        var form  = entry.getIn(['data','formulario']) || CMS.Map();

        return React.createElement('div', null,
          React.createElement('style', null, css),

          // NAV
          React.createElement('nav', null,
            React.createElement('div', {className:'nav-logo'}, 'VEGA', React.createElement('span',null,'.pe')),
            React.createElement('a', {href:'#', className:'nav-pill'}, 'Registrarme')
          ),

          // HERO
          React.createElement('section', {className:'hero'},
            React.createElement('div', {className:'hero-badge'}, 'Programa de fidelización'),
            React.createElement('h1', null, hero.get('titulo') || 'Bienvenido al Vega Cash'),
            React.createElement('p', {className:'hero-sub'}, hero.get('subtitulo') || ''),
            React.createElement('a', {href:'#', className:'hero-cta'}, hero.get('cta') || 'Quiero unirme')
          ),

          // STATS
          React.createElement('div', {className:'stats-bar'},
            React.createElement('div', {className:'stat-item'}, React.createElement('span',{className:'stat-num'}, stats.get('s1_num')||''), React.createElement('span',{className:'stat-label'}, stats.get('s1_label')||'')),
            React.createElement('div', {className:'stat-item'}, React.createElement('span',{className:'stat-num'}, stats.get('s2_num')||''), React.createElement('span',{className:'stat-label'}, stats.get('s2_label')||'')),
            React.createElement('div', {className:'stat-item'}, React.createElement('span',{className:'stat-num'}, stats.get('s3_num')||''), React.createElement('span',{className:'stat-label'}, stats.get('s3_label')||'')),
            React.createElement('div', {className:'stat-item'}, React.createElement('span',{className:'stat-num'}, stats.get('s4_num')||''), React.createElement('span',{className:'stat-label'}, stats.get('s4_label')||''))
          ),

          // BENEFICIOS
          React.createElement('section', {className:'beneficios'},
            React.createElement('div', {className:'beneficios-header'},
              React.createElement('div', {className:'section-tag'}, '¿Por qué unirse?'),
              React.createElement('h2', {className:'section-title'}, 'Beneficios que marcan la diferencia')
            ),
            React.createElement('div', {className:'beneficios-grid'},
              ...[1,2,3,4].map(n =>
                React.createElement('div', {className:'beneficio-card', key:n},
                  React.createElement('h3', null, bens.get('b'+n+'_titulo') || ''),
                  React.createElement('p',  null, bens.get('b'+n+'_desc')   || '')
                )
              )
            )
          ),

          // PASOS
          React.createElement('section', {className:'como-funciona'},
            React.createElement('div', {className:'pasos-layout'},
              React.createElement('div', null,
                React.createElement('div', {className:'section-tag'}, pasos.get('tag') || '¿Cómo funciona?'),
                React.createElement('h2', {className:'section-title'}, pasos.get('titulo') || ''),
                React.createElement('p',  {className:'section-sub'},   pasos.get('subtitulo') || ''),
                React.createElement('ul', {className:'pasos-list'},
                  ...[1,2,3].map(n =>
                    React.createElement('li', {className:'paso', key:n},
                      React.createElement('div', {className:'paso-num'}, String(n)),
                      React.createElement('div', {className:'paso-info'},
                        React.createElement('h4', null, pasos.get('p'+n+'_titulo') || ''),
                        React.createElement('p',  null, pasos.get('p'+n+'_desc')   || '')
                      )
                    )
                  )
                )
              ),
              React.createElement('div', {style:{background:'#F7F6F3',borderRadius:'16px',padding:'32px',textAlign:'center',color:'#6B6860',fontSize:'13px'}},
                'Vista previa del perfil de miembro'
              )
            )
          ),

          // FORMULARIO
          React.createElement('section', {className:'formulario-section'},
            React.createElement('div', {className:'form-wrapper'},
              React.createElement('div', {className:'form-header'},
                React.createElement('div', {className:'section-tag'}, form.get('tag') || ''),
                React.createElement('h2', {className:'section-title'}, form.get('titulo') || ''),
                React.createElement('p',  {className:'section-sub'},   form.get('subtitulo') || '')
              ),
              React.createElement('div', {className:'form-placeholder'}, '[ Formulario de registro ]')
            )
          ),

          // FOOTER
          React.createElement('footer', null,
            React.createElement('div', {className:'footer-logo'}, 'VEGA', React.createElement('span',null,'.pe')),
            React.createElement('p', null, '© 2026 Corporación VEGA SAC')
          )
        );
      }
    });

    CMS.registerPreviewTemplate('landing', h);
  </script>
</body>
</html>
