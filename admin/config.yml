backend:
  name: github
  repo: VEGAECOMMERCE/vega-cash-landing
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "config"
    label: "Configuración de la Landing"
    files:
      - name: "landing"
        label: "Landing Vega Cash"
        file: "content.json"
        fields:
          - label: "HERO"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Título principal", name: "titulo", widget: "string" }
              - { label: "Subtítulo", name: "subtitulo", widget: "text" }
              - { label: "Texto botón CTA", name: "cta", widget: "string" }
              - { label: "Imagen de fondo", name: "imagen", widget: "image", required: false }

          - label: "STATS"
            name: "stats"
            widget: "object"
            fields:
              - { label: "Stat 1 — Número", name: "s1_num", widget: "string" }
              - { label: "Stat 1 — Etiqueta", name: "s1_label", widget: "string" }
              - { label: "Stat 2 — Número", name: "s2_num", widget: "string" }
              - { label: "Stat 2 — Etiqueta", name: "s2_label", widget: "string" }
              - { label: "Stat 3 — Número", name: "s3_num", widget: "string" }
              - { label: "Stat 3 — Etiqueta", name: "s3_label", widget: "string" }
              - { label: "Stat 4 — Número", name: "s4_num", widget: "string" }
              - { label: "Stat 4 — Etiqueta", name: "s4_label", widget: "string" }

          - label: "BENEFICIOS"
            name: "beneficios"
            widget: "object"
            fields:
              - { label: "Beneficio 1 — Título", name: "b1_titulo", widget: "string" }
              - { label: "Beneficio 1 — Descripción", name: "b1_desc", widget: "text" }
              - { label: "Beneficio 2 — Título", name: "b2_titulo", widget: "string" }
              - { label: "Beneficio 2 — Descripción", name: "b2_desc", widget: "text" }
              - { label: "Beneficio 3 — Título", name: "b3_titulo", widget: "string" }
              - { label: "Beneficio 3 — Descripción", name: "b3_desc", widget: "text" }
              - { label: "Beneficio 4 — Título", name: "b4_titulo", widget: "string" }
              - { label: "Beneficio 4 — Descripción", name: "b4_desc", widget: "text" }

          - label: "CÓMO FUNCIONA"
            name: "pasos"
            widget: "object"
            fields:
              - { label: "Tag", name: "tag", widget: "string" }
              - { label: "Título sección", name: "titulo", widget: "string" }
              - { label: "Subtítulo sección", name: "subtitulo", widget: "string" }
              - { label: "Paso 1 — Título", name: "p1_titulo", widget: "string" }
              - { label: "Paso 1 — Descripción", name: "p1_desc", widget: "text" }
              - { label: "Paso 2 — Título", name: "p2_titulo", widget: "string" }
              - { label: "Paso 2 — Descripción", name: "p2_desc", widget: "text" }
              - { label: "Paso 3 — Título", name: "p3_titulo", widget: "string" }
              - { label: "Paso 3 — Descripción", name: "p3_desc", widget: "text" }

          - label: "FORMULARIO"
            name: "formulario"
            widget: "object"
            fields:
              - { label: "Tag", name: "tag", widget: "string" }
              - { label: "Título", name: "titulo", widget: "string" }
              - { label: "Subtítulo", name: "subtitulo", widget: "string" }
              - { label: "Texto botón enviar", name: "btn_texto", widget: "string" }
              - { label: "Nota de privacidad", name: "privacidad_nota", widget: "string" }
              - { label: "Texto legal (sin links)", name: "texto_legal", widget: "text" }
              - { label: "URL Términos y condiciones", name: "url_terminos", widget: "string" }
              - { label: "URL Política de privacidad", name: "url_privacidad", widget: "string" }
              - { label: "Mensaje éxito — Título", name: "exito_titulo", widget: "string" }
              - { label: "Mensaje éxito — Descripción", name: "exito_desc", widget: "text" }
